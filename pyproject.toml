[project]
name = "dns-packet-builder"
version = "0.1.1"
description = "Build DNS query and response packets as wire-format data using only the standard library."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
